name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # unsigned universal build: no Apple Developer certificate configured
      - run: npx tauri build --target universal-apple-darwin --bundles dmg,app
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-code-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      # stable file name so README can link releases/latest/download/vibe-code_universal.dmg
      - run: cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg vibe-code_universal.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: vibe-code_universal.dmg
