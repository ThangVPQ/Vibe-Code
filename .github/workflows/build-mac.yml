name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # unsigned universal build: no Apple Developer certificate configured
      - run: npx tauri build --target universal-apple-darwin --bundles dmg,app
      # stable file name so README can link releases/latest/download/vibe-code_universal.dmg
      - run: cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg vibe-code_universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-code-mac
          path: vibe-code_universal.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis
      # same name the in-app updater and README expect
      - run: Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe).FullName vibe-code_x64-setup.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-code-windows
          path: vibe-code_x64-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            vibe-code_universal.dmg
            vibe-code_x64-setup.exe
